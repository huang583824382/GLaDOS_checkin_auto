name: runGladosAction

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
  watch:
    types: [started]

jobs:
  checkin:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run checkin
        run: python3 glados.py
        env:
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_USER_AGENT: ${{ vars.GLADOS_USER_AGENT }}
          EXCHANGE_PLAN: ${{ vars.EXCHANGE_PLAN }}
          CHECKIN_DIAGNOSTIC_ONLY: ${{ github.event.inputs.diagnose_only || 'false' }}
          CHECKIN_MAX_ATTEMPTS: '3'
          CHECKIN_RETRY_DELAY_SECONDS: '60'
